<dialog #dialog>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <h2>Nhập {{ item()?.name }}</h2>
    <label>
      Số lượng ({{ item()?.unit }})
      <input formControlName="qty" type="number" min="0.001" step="any" inputmode="decimal" />
    </label>
    <label>
      Hạn sử dụng
      <input formControlName="exp" type="date" />
      <small>Bỏ trống nếu bao bì không ghi hạn.</small>
    </label>
    <menu>
      <button type="button" class="btn" (click)="close()">Huỷ</button>
      <button type="submit" class="btn primary" [disabled]="form.invalid">Nhập kệ</button>
    </menu>
  </form>
</dialog>
